<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>札幌トイレマップ</title>
<meta name="description" content="すすきの周辺のトイレを地図で探す。いちばん近いトイレへ一発ナビ。">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest?v=861daa9a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=49570470">
<link rel="icon" href="icon-192.png?v=3a9559ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トイレマップ">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=81b6aadd">
</head>
<body>
<div id="map"></div>

<header id="top">
  <div class="brand" id="brand"></div>
  <div class="tr"><button id="layers" class="round" aria-label="地図の色を切り替え"></button><button id="here" class="round" aria-label="現在地へ"></button></div>
  <div id="filters">
    <div class="frow">
      <button data-k="all" aria-pressed="true">すべて</button>
      <button data-k="tonly" aria-pressed="false">トイレ</button>
      <button data-k="conly" aria-pressed="false">コンビニ</button>
      <button data-f="open" aria-pressed="false">いま空いてる</button>
    </div>
    <div class="frow" id="subf" hidden>
      <button data-f="free" data-g="t" aria-pressed="false">無料</button>
      <button data-f="wheel" data-g="t" aria-pressed="false">車いす</button>
      <button data-f="h24" data-g="t" aria-pressed="false">24時間</button>
      <button data-f="conv" data-g="c" aria-pressed="false">借りられる</button>
      <button data-f="b_seven" data-g="c" aria-pressed="false">セブン</button>
      <button data-f="b_family" data-g="c" aria-pressed="false">ファミマ</button>
      <button data-f="b_lawson" data-g="c" aria-pressed="false">ローソン</button>
      <button data-f="b_seico" data-g="c" aria-pressed="false">セイコマ</button>
    </div>
  </div>
</header>

<div id="cross" hidden></div>

<div id="guide" hidden></div>
<div id="settings" hidden></div>

<section id="sheet">
  <div id="grab" aria-label="シートを開閉"><i></i></div>
  <div id="sbody"></div>
</section>

<button id="legendBtn" class="legend-btn" aria-label="凡例を開く"></button>
<section id="legend" hidden></section>

<nav id="tabs">
  <button data-t="list"><span id="ic-list"></span>リスト</button>
  <button id="tabadd" class="addtab" aria-label="トイレを追加"><span id="ic-add"></span></button>
  <button id="info"><span id="ic-set"></span>設定</button>
</nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=b8099f3c"></script>
<script src="data/toilets.js?v=53bc3aa3"></script>
<script src="js/geo.js?v=1a5e67f5"></script>
<script src="js/hours.js?v=00fea5ba"></script>
<script src="js/icons.js?v=20d36588"></script>
<script src="js/bear.js?v=cbdea3a8"></script>
<script src="js/cloud.js?v=1c62d3ac"></script>
<script src="js/map.js?v=98ed2054"></script>
<script src="js/settings.js?v=f64fe4dd"></script>
<script src="js/ui.js?v=d151fb3e"></script>
<script src="js/add.js?v=03f4b26a"></script>
<script src="js/main.js?v=3f38dad2"></script>
</body>
</html>
