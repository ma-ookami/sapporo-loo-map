<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>運営 | 札幌トイレ・コンビニマップ</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#1d1a17;--sub:#7a746d;--line:#e4e0da;--accent:#c4521f;--ok:#1f9d62;--ng:#c0392b;--tint:#ecebe7}
@media (prefers-color-scheme:dark){:root{--bg:#1c1915;--card:#26221d;--ink:#f3f0ea;--sub:#a39d95;--line:#3a352e;--tint:#34302a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px}
.sub{color:var(--sub);font-size:12.5px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--tint);color:var(--ink)}
button.cta{background:var(--accent);color:#fff;font-weight:700}
button.ok{background:var(--ok);color:#fff;font-weight:700}
button.ng{background:transparent;color:var(--ng);border:1px solid var(--ng)}
#map{height:280px;border-radius:14px;margin:12px 0;border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card.on{outline:2px solid var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.row label{display:flex;flex-direction:column;font-size:11.5px;color:var(--sub);gap:2px}
.row input,.row select,.row textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row input[type=text]{width:220px}.row textarea{width:100%;min-height:52px}
.near{font-size:12.5px;margin:6px 0;padding:6px 8px;border-radius:8px;background:var(--tint)}
.near.warn{background:#fdebd6;color:#8a4b00}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--tint);font-size:11.5px;margin-right:4px}
#msg{margin:10px 0;color:var(--ng)}
.num{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:800;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>運営 <span class="sub">札幌トイレ・コンビニマップ</span></h1>
  <div class="sub">申請を見て、許可するとみんなの地図に出ます。このページはアプリからはリンクしていません。</div>
  <div id="auth" class="row"></div>
  <div id="msg"></div>
  <div id="main" hidden>
    <div id="map"></div>
    <h2>許可待ちの申請 <span id="pn" class="sub"></span></h2>
    <div id="pending"></div>
    <h2>公開中のユーザー追加 <span id="an" class="sub"></span></h2>
    <div class="sub">間違いや荒らしは、ここから削除できます。</div>
    <div id="added"></div>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data/toilets.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
