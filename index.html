<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>札幌トイレマップ</title>
<meta name="description" content="すすきの周辺のトイレを地図で探す。いちばん近いトイレへ一発ナビ。">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest?v=861daa9a">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=ee0adca4">
<link rel="icon" href="icon-192.png?v=2eb7d8b0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トイレマップ">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css?v=48254117">
</head>
<body>
<div id="map"></div>

<header id="top">
  <div class="brand" id="brand"></div>
  <div class="tr"><button id="layers" class="round" aria-label="地図の色を切り替え"></button><button id="info" class="round" aria-label="設定"></button><button id="here" class="round" aria-label="現在地へ"></button></div>
  <div id="filters">
    <button data-f="free" aria-pressed="false">無料</button>
    <button data-f="wheel" aria-pressed="false">車いす</button>
    <button data-f="open" aria-pressed="false">いま空いてる</button>
    <button data-f="h24" aria-pressed="false">24時間</button>
    <button data-f="conv" aria-pressed="false">借りられるコンビニ</button>
  </div>
</header>

<div id="cross" hidden></div>

<div id="guide" hidden></div>
<div id="settings" hidden></div>

<section id="sheet">
  <div id="grab" aria-label="シートを開閉"><i></i></div>
  <div id="sbody"></div>
</section>

<nav id="tabs">
  <button data-t="map" class="on"><span id="ic-map"></span>地図</button>
  <button id="tabadd" class="addtab" aria-label="トイレを追加"><span id="ic-add"></span></button>
  <button data-t="list"><span id="ic-list"></span>リスト</button>
</nav>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=b8099f3c"></script>
<script src="data/toilets.js?v=02cfe460"></script>
<script src="js/geo.js?v=1a5e67f5"></script>
<script src="js/hours.js?v=00fea5ba"></script>
<script src="js/icons.js?v=20d36588"></script>
<script src="js/bear.js?v=abb4f48b"></script>
<script src="js/cloud.js?v=1c62d3ac"></script>
<script src="js/map.js?v=79ed05f6"></script>
<script src="js/settings.js?v=4cdccf97"></script>
<script src="js/ui.js?v=9ead55d9"></script>
<script src="js/add.js?v=03f4b26a"></script>
<script src="js/main.js?v=222f5b31"></script>
</body>
</html>
